version: '3.8'

services:
  vitamatica_db:
    image: postgres:15
    container_name: vitamatica_db_container
    environment:
      POSTGRES_DB: vitamatica_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"  # Exposes PostgreSQL on your localhost:5432
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # This file will initialize tables with dummy data
      - ./postgres_data:/var/lib/postgresql/data  # Optional: Persist PostgreSQL data outside the container
    networks:
      - vitamatica-network
networks:
  vitamatica-network:
    driver: bridge
